<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffe4ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="帶著 15 隻小鴨，一路游回農舍的療癒小遊戲。">
<title>鴨媽媽回家</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='52' r='40' fill='%23ffe066'/%3E%3Cellipse cx='38' cy='46' rx='5' ry='6' fill='%233b2a36'/%3E%3Cellipse cx='62' cy='46' rx='5' ry='6' fill='%233b2a36'/%3E%3Cpath d='M38 60 Q50 52 62 60 Q58 70 50 70 Q42 70 38 60Z' fill='%23ff9a5c'/%3E%3Cellipse cx='26' cy='60' rx='7' ry='4' fill='%23ff9fb8'/%3E%3Cellipse cx='74' cy='60' rx='7' ry='4' fill='%23ff9fb8'/%3E%3C/svg%3E">
<style>
:root{
  --pink:#ff9fbd;--pink2:#ffc8d8;--pinkd:#ef86a8;
  --blue:#a9dcfa;--blued:#6fb6ea;
  --yellow:#ffe58a;--yellowd:#f2c64c;
  --mint:#b8ecd7;--mintd:#7fd0ad;
  --cream:#fffaf3;--lav:#ddd0ff;
  --text:#6b4a5a;--text2:#a7869a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;color:var(--text);
  background:radial-gradient(circle at 20% 10%,#fff3f7 0,#ffe4ee 45%,#e6f3ff 100%)}
#app{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;max-width:480px;overflow:hidden;background:#c9f0d6;
  box-shadow:0 0 40px rgba(200,120,160,.18)}
canvas#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;z-index:5;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 0}
#hud .row{display:flex;align-items:center;gap:8px}
#hud .row > *{pointer-events:auto}
.pill{display:flex;align-items:center;gap:4px;height:42px;padding:0 12px 0 5px;border-radius:999px;
  background:linear-gradient(180deg,#fff 0%,#fff3f7 100%);border:2px solid #fff;
  box-shadow:0 5px 14px rgba(170,100,135,.2),inset 0 -3px 0 rgba(255,180,205,.35)}
.pill .ic{width:34px;height:34px;position:relative}
.pill .ic img{position:absolute;inset:0;width:100%;height:100%}
.pill b{font-size:21px;color:#ff7aa2;font-weight:900;line-height:1;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.pill b.bump{transform:scale(1.35)}
.pill small{font-size:13px;color:var(--text2);font-weight:700;margin-left:1px}
.prog{flex:1;display:flex;align-items:center;height:42px;padding:0 6px 0 10px;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,246,250,.9));border:2px solid #fff;
  box-shadow:0 5px 14px rgba(170,100,135,.16)}
.track{flex:1;height:12px;border-radius:99px;background:#fdeff4;position:relative;
  box-shadow:inset 0 2px 3px rgba(170,110,140,.18)}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;
  background:linear-gradient(90deg,#ffd6e2,#ff9fbd);box-shadow:inset 0 2px 0 rgba(255,255,255,.6)}
.track .mk{position:absolute;top:50%;left:0;width:28px;height:28px;transform:translate(-50%,-62%)}
.prog .home{width:30px;height:28px;margin-left:4px}
.icon-btn{width:42px;height:42px;flex:none;border-radius:50%;border:2px solid #fff;padding:0;display:grid;place-items:center;cursor:pointer;
  background:linear-gradient(180deg,#fff,#ffeef4);color:#ff7aa2;
  box-shadow:0 5px 14px rgba(170,100,135,.2),inset 0 -3px 0 rgba(255,180,205,.35);
  transition:transform .35s cubic-bezier(.34,1.8,.5,1)}
.icon-btn:active{transform:scale(.82);transition-duration:.08s}
.icon-btn svg{width:22px;height:22px}
#lostTag{margin:8px auto 0;width:max-content;display:flex;align-items:center;gap:6px;padding:4px 12px 4px 6px;border-radius:999px;
  background:linear-gradient(180deg,#fff7fa,#ffe1ea);border:2px solid #fff;color:#e66b93;font-size:13px;font-weight:800;
  box-shadow:0 4px 12px rgba(230,107,147,.22);animation:pulse 1.2s ease-in-out infinite}
#lostTag img{width:24px;height:24px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* ---------- Toast ---------- */
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 92px);z-index:6;
  display:flex;align-items:center;gap:8px;max-width:88%;padding:8px 16px 8px 8px;border-radius:22px;
  background:linear-gradient(180deg,#fffdf8,#fff0f5);border:2px solid #fff;font-weight:800;font-size:14px;color:var(--text);
  box-shadow:0 10px 24px rgba(170,100,135,.25);opacity:0;transform:translate(-50%,-14px) scale(.9);
  transition:opacity .25s,transform .4s cubic-bezier(.34,1.56,.64,1);pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
#toast .ti{width:38px;height:38px;flex:none;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#ffe6ee);display:grid;place-items:center}
#toast .ti img{width:32px;height:32px;object-fit:contain}
#toast.warn{background:linear-gradient(180deg,#fffaf0,#ffe9ef)}

/* ---------- Hint ---------- */
#hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18%);z-index:4;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#hint .bubble{padding:9px 16px;border-radius:18px;background:rgba(255,255,255,.95);font-weight:800;font-size:15px;color:#e66b93;
  box-shadow:0 8px 20px rgba(170,100,135,.22);white-space:nowrap}
#hint svg{width:64px;height:80px;animation:drag 1.6s ease-in-out infinite}
@keyframes drag{0%{transform:translateY(26px);opacity:0}15%{opacity:1}70%{transform:translateY(-30px);opacity:1}100%{transform:translateY(-34px);opacity:0}}

/* ---------- Screens ---------- */
.screen{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 18px);
  background:linear-gradient(180deg,rgba(255,236,244,.55),rgba(226,244,255,.55));-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.card{position:relative;width:100%;max-width:370px;max-height:100%;overflow:auto;padding:22px 20px 20px;border-radius:30px;text-align:center;
  background:linear-gradient(180deg,#fffdf9 0%,#fff3f7 100%);border:3px solid #fff;
  box-shadow:0 24px 50px rgba(160,90,125,.28),inset 0 -4px 0 rgba(255,190,210,.35);
  animation:popIn .55s cubic-bezier(.34,1.56,.64,1) both}
@keyframes popIn{0%{transform:scale(.7) translateY(30px);opacity:0}100%{transform:none;opacity:1}}
.card h1{margin:4px 0 2px;font-size:36px;font-weight:900;letter-spacing:2px;color:#ff7aa2;
  text-shadow:0 3px 0 #fff,0 5px 0 #ffd3e0,0 8px 14px rgba(255,122,162,.3)}
.card h2{margin:4px 0;font-size:22px;font-weight:900;color:#ff7aa2}
.sub{margin:0 0 12px;font-size:14px;color:var(--text2);font-weight:700}
.logo{display:flex;justify-content:center;align-items:flex-end;gap:2px;height:84px;margin-top:2px}
.duckimg{position:relative;display:inline-block}
.duckimg img{position:absolute;inset:0;width:100%;height:100%}
.logo .duckimg{animation:bob 1.6s ease-in-out infinite}
.logo .duckimg:nth-child(2){animation-delay:.2s}.logo .duckimg:nth-child(3){animation-delay:.4s}.logo .duckimg:nth-child(4){animation-delay:.6s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
.how{list-style:none;margin:6px 0 14px;padding:12px 12px;border-radius:20px;text-align:left;background:rgba(255,255,255,.75);
  box-shadow:inset 0 2px 6px rgba(200,140,170,.12)}
.how li{display:flex;gap:10px;align-items:center;padding:5px 2px;font-size:13.5px;font-weight:700;line-height:1.45}
.how li img{width:34px;height:34px;flex:none;object-fit:contain}
.how li b{color:#ff7aa2}
.best{display:inline-flex;align-items:center;gap:6px;margin:0 0 14px;padding:6px 14px;border-radius:999px;background:linear-gradient(180deg,#fff8dc,#ffefb5);
  color:#c98b1e;font-weight:800;font-size:14px;box-shadow:0 3px 0 #f7dc8a}
.btn{display:block;width:100%;margin:10px 0 0;padding:15px 18px;border:none;border-radius:999px;cursor:pointer;
  font:inherit;font-size:19px;font-weight:900;letter-spacing:1px;color:#fff;
  background:linear-gradient(180deg,#ffbcd0 0%,#ff8fb3 100%);text-shadow:0 2px 0 rgba(220,90,130,.35);
  box-shadow:0 6px 0 #ec7ca2,0 12px 22px rgba(255,130,170,.35),inset 0 3px 0 rgba(255,255,255,.45);
  transition:transform .4s cubic-bezier(.34,1.9,.5,1),box-shadow .4s}
.btn:active{transform:translateY(4px) scale(.95);box-shadow:0 2px 0 #ec7ca2,0 6px 12px rgba(255,130,170,.3),inset 0 3px 0 rgba(255,255,255,.45);transition-duration:.07s}
.btn.blue{background:linear-gradient(180deg,#bfe7ff,#86c9f3);box-shadow:0 6px 0 #6eb3e2,0 12px 22px rgba(110,180,230,.35),inset 0 3px 0 rgba(255,255,255,.45);text-shadow:0 2px 0 rgba(70,140,200,.35)}
.btn.blue:active{box-shadow:0 2px 0 #6eb3e2,0 6px 12px rgba(110,180,230,.3),inset 0 3px 0 rgba(255,255,255,.45)}
.btn.mint{background:linear-gradient(180deg,#c9f5e2,#8edcbb);box-shadow:0 6px 0 #74c7a3,0 12px 22px rgba(110,200,160,.35),inset 0 3px 0 rgba(255,255,255,.45);text-shadow:0 2px 0 rgba(70,160,120,.35)}
.btn.mint:active{box-shadow:0 2px 0 #74c7a3,0 6px 12px rgba(110,200,160,.3),inset 0 3px 0 rgba(255,255,255,.45)}
.btn.ghost{background:linear-gradient(180deg,#fff,#fff4f8);color:#e66b93;text-shadow:none;font-size:16px;padding:12px;
  box-shadow:0 4px 0 #f6cfdc,0 8px 16px rgba(255,130,170,.18)}
.btn.ghost:active{box-shadow:0 1px 0 #f6cfdc}
.btn svg{width:22px;height:22px;vertical-align:-4px;margin-right:6px}
.foot{margin-top:12px;font-size:12px;color:var(--text2);font-weight:600}
.btns2{display:flex;gap:10px}.btns2 .btn{flex:1}

/* result */
.ribbon{display:inline-block;margin:0 0 6px;padding:5px 18px;border-radius:999px;background:linear-gradient(180deg,#d6f6e8,#aee8cf);color:#3f9d78;font-weight:900;font-size:14px;box-shadow:0 3px 0 #92d9b9}
.bigcount{display:flex;align-items:baseline;justify-content:center;gap:4px;margin:2px 0}
.bigcount b{font-size:64px;line-height:1;font-weight:900;color:#ff7aa2;text-shadow:0 4px 0 #ffd6e2}
.bigcount span{font-size:22px;font-weight:900;color:var(--text2)}
.rtitle{margin:8px 0 10px;padding:12px 14px;border-radius:18px;background:linear-gradient(180deg,#fff,#fff6e3);font-size:18px;font-weight:900;color:#c07a2e;
  box-shadow:inset 0 0 0 2px #ffe9b8}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:6px 0 8px;padding:10px 8px;border-radius:20px;background:rgba(255,255,255,.7)}
.grid .duckimg{width:100%;aspect-ratio:1;animation:popIn .45s cubic-bezier(.34,1.56,.64,1) both}
.grid .duckimg.lost{filter:grayscale(1) opacity(.35)}
.missing{font-size:12.5px;color:var(--text2);font-weight:700;margin:0 0 6px;line-height:1.5}
.stats{display:flex;justify-content:center;gap:8px;margin:4px 0 6px;flex-wrap:wrap}
.stats span{padding:5px 11px;border-radius:999px;background:#f2f9ff;color:#5f97c4;font-size:13px;font-weight:800}
.newrec{display:inline-block;margin-left:6px;padding:2px 9px;border-radius:999px;background:#ff8fb3;color:#fff;font-size:12px;font-weight:900;animation:pulse 1s infinite}
#copyTip{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);transform:translateX(-50%);z-index:20;padding:10px 18px;border-radius:999px;
  background:rgba(107,74,90,.88);color:#fff;font-weight:800;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#copyTip.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div class="row">
      <div class="pill"><span class="ic"><img id="hudDuck" alt=""><img id="hudDuckAcc" alt=""></span><b id="cnt">15</b><small>/15</small></div>
      <div class="prog"><div class="track"><div class="fill" id="progFill"></div><img class="mk" id="progMama" alt=""></div><img class="home" id="progHouse" alt=""></div>
      <button class="icon-btn" id="btnPause" aria-label="暫停">
        <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4.2" height="14" rx="2" fill="currentColor"/><rect x="13.8" y="5" width="4.2" height="14" rx="2" fill="currentColor"/></svg>
      </button>
      <button class="icon-btn" id="btnMute" aria-label="靜音">
        <svg viewBox="0 0 24 24" id="icoSound"><path d="M4 9.5h3.2L12 5.6v12.8l-4.8-3.9H4z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path id="waves" d="M15.5 9a4 4 0 0 1 0 6M17.8 6.6a7.4 7.4 0 0 1 0 10.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path id="cross" d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="display:none"/></svg>
      </button>
    </div>
    <div id="lostTag" class="hidden"><img id="lostImg" alt="">走丟 <span id="lostN">0</span> 隻・回頭碰牠救回來！</div>
  </div>

  <div id="toast"><span class="ti"><img alt=""></span><span class="tt"></span></div>

  <div id="hint" class="hidden">
    <svg viewBox="0 0 64 80"><defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#ffe3ec"/></linearGradient></defs>
      <circle cx="30" cy="16" r="13" fill="#ff9fbd" opacity=".35"/><circle cx="30" cy="16" r="7" fill="#ff9fbd" opacity=".55"/>
      <path d="M24 18 Q24 12 29 12 Q34 12 34 18 L34 34 Q38 31 42 33 Q46 30 50 33 Q55 32 56 38 L56 54 Q56 70 42 74 L34 74 Q24 72 18 60 L12 48 Q10 43 15 42 Q19 41 24 48Z" fill="url(#fg)" stroke="#e98aac" stroke-width="2.6" stroke-linejoin="round"/>
    </svg>
    <div class="bubble">按住螢幕拖曳，帶大家回家！</div>
  </div>

  <div class="screen" id="titleScr">
    <div class="card">
      <div class="logo" id="logo"></div>
      <h1>鴨媽媽回家</h1>
      <p class="sub">帶著 15 隻小鴨，平安游回河邊的小農舍</p>
      <ul class="how">
        <li><img id="howA" alt=""><span><b>按住拖曳</b>：鴨媽媽跟著手指游，小鴨排隊跟上</span></li>
        <li><img id="howB" alt=""><span><b>放開手指</b>：大家停下喘口氣，但水流會往回推、老鷹也會盯上</span></li>
        <li><img id="howC" alt=""><span><b>掉隊的小鴨</b>：游回去碰牠一下，就會重新跟上</span></li>
        <li><img id="howD" alt=""><span>沿路危險隨機出現，最後的<b>瀑布</b>記得走左邊小水道</span></li>
      </ul>
      <div class="best" id="bestTitle">最佳紀錄：還沒有</div>
      <button class="btn" id="btnStart">出發囉！</button>
      <div class="foot">直式手機遊玩・打開聲音更療癒・點小鴨會呱呱叫</div>
    </div>
  </div>

  <div class="screen hidden" id="pauseScr">
    <div class="card">
      <div class="logo" id="logoP"></div>
      <h2>休息一下</h2>
      <p class="sub">遊戲暫停中，小鴨們在原地等你</p>
      <button class="btn" id="btnResume">繼續游</button>
      <button class="btn ghost" id="btnRestart">重新開始</button>
    </div>
  </div>

  <div class="screen hidden" id="resultScr">
    <div class="card">
      <div class="ribbon">回到農舍了！</div>
      <div class="bigcount"><b id="rCount">0</b><span>/ 15 隻</span></div>
      <div class="rtitle" id="rTitle"></div>
      <div class="grid" id="rGrid"></div>
      <p class="missing" id="rMissing"></p>
      <div class="stats" id="rStats"></div>
      <div class="best" id="rBest"></div>
      <div class="btns2">
        <button class="btn mint" id="btnShare"><svg viewBox="0 0 24 24"><path d="M12 3.5c-5 0-9 3.2-9 7.2 0 3.6 3.2 6.6 7.5 7.1.3.1.7.2.8.5.1.3 0 .7 0 1l-.1.8c0 .3-.2 1 .9.5s5.8-3.4 7.9-5.9c1.5-1.6 2-3.1 2-4.6 0-3.9-4-7.1-9-7.1z" fill="#fff"/></svg>分享</button>
        <button class="btn" id="btnAgain">再玩一次</button>
      </div>
    </div>
  </div>
  <div id="copyTip"></div>
</div>

<script>
'use strict';
/* =========================================================
   鴨媽媽回家 — single-file game
   world units: width 360, y grows downward; progress p = -y
   ========================================================= */
const $ = s => document.querySelector(s);
const cvs = $('#game'), ctx = cvs.getContext('2d');
const QS = new URLSearchParams(location.search);
const TS = Math.max(0.1, Math.min(12, +QS.get('ts') || 1));   // debug time scale

const W = 360;
const L = 6000;                     // river length (progress to the farm)
const WF_START = L - 1150;          // waterfall zone (progress)
const WF_END = L - 540;
const WF_X = 314;                   // waterfall lip x
const CUR = 24;                     // river current (units/s, downstream = +y)
const MAMA_SPD = 150, DUCK_SPD = 190, GAP = 17;
const N_DUCKS = 15;
const STEP = 1 / 60;
const Z = [0, 0];

const R = Math.random;
const rand = (a, b) => a + R() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const hyp = Math.hypot;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = (R() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
function hash(a, b) { let h = (a * 374761393 + b * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }

/* ---------------- river geometry ---------------- */
function bankL(y) {
  const p = -y;
  let b = 40 + 13 * Math.sin(p * 0.0034 + 1.3) + 7 * Math.sin(p * 0.0097 + 0.4);
  const k = smooth(WF_START - 300, WF_START - 60, p);
  return b * (1 - k) + 48 * k;
}
function bankR(y) {
  const p = -y;
  let b = 320 - 13 * Math.sin(p * 0.0031 + 2.1) - 7 * Math.sin(p * 0.0089 + 1.7);
  const kIn = smooth(WF_START - 220, WF_START, p);
  const kOut = smooth(WF_END, WF_END + 190, p);
  b = b * (1 - kIn) + 376 * kIn;
  return b * (1 - kOut) + 232 * kOut;
}
function isWF(y) { const p = -y; return p > WF_START - 220 && p < WF_END + 190 && bankR(y) > WF_X + 2; }
function wfK(y) { const p = -y; return smooth(WF_START - 280, WF_START - 30, p) * (1 - smooth(WF_END - 60, WF_END + 110, p)); }
function riverR(y) { return isWF(y) ? WF_X - 40 : bankR(y); }  // usable right edge for placing things
function inWater(y) { return y < 52 && y > -L; }

/* ---------------- SVG sprites ---------------- */
const S = {}, URLS = {};
const RES = 3.4;
const svgURL = s => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
function makeSprite(name, svg, w, h) {
  const url = svgURL(svg); URLS[name] = url;
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(w * RES)); c.height = Math.max(1, Math.round(h * RES));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      S[name] = { c, w, h }; res();
    };
    img.onerror = () => { console.warn('sprite failed', name); res(); };
    img.src = url;
  });
}
function spr(name, x, y, w, h, ax = .5, ay = .5) {
  const s = S[name]; if (!s) return;
  w = w || s.w; h = h || s.h;
  ctx.drawImage(s.c, x - w * ax, y - h * ay, w, h);
}

      t = bag.pop();
      if ((t === last || (list.length > 1 && list[list.length - 2].type === t)) && bag.length) { const u = bag.pop(); bag.unshift(t); t = u; }
    }
    list.push({ p, type: t }); last = t;
    p += lerp(520, 250, f) * rand(0.85, 1.15);
  }
  return list;
}

function buildDeco() {
  const D = [];
  const add = (n, x, y, w, h, layer = 'land') => D.push({ n, x, y, w, h, layer, ph: R() * 6 });
  const FL = ['flP', 'flB', 'flY', 'flW', 'flL'];
  for (let p = -40; p < L + 40; p += rand(22, 34)) {
    const y = -p;
    for (const side of [-1, 1]) {
      if (side > 0 && p > WF_START - 240 && p < WF_END + 200) continue;
      const edge = side < 0 ? bankL(y) : bankR(y);
      const r = R();
      if (r < 0.42) add('reed', edge + side * rand(2, 9), y, 18 * rand(.85, 1.15), 36 * rand(.85, 1.15));
      else if (r < 0.75) add(FL[(R() * 5) | 0], edge + side * rand(12, 34), y, 12, 12);
      else if (r < 0.83) add('bush', edge + side * rand(20, 34), y, 36, 24);
      else if (r < 0.87) add('mush', edge + side * rand(14, 28), y, 14, 14);
      else add('tuft', edge + side * rand(10, 34), y, 10, 8);
    }
    if (R() < 0.12) {
      const side = R() < .5 ? -1 : 1;
      if (!(side > 0 && p > WF_START - 300 && p < WF_END + 220)) {
        const edge = side < 0 ? bankL(y) : bankR(y);
        add('lily', edge - side * rand(16, 30), y, 26, 20, 'water');
        if (R() < .45) add('lotus', edge - side * rand(16, 30), y - 4, 16, 14, 'water');
      }
    }
  }
  // wide meadow right of the final channel
  for (let p = WF_END + 220; p < L; p += rand(30, 50)) {
    const y = -p, x0 = bankR(y) + 20;
    if (R() < .3) add('tree', rand(x0 + 20, 340), y, 56, 68);
    else if (R() < .6) add('bush', rand(x0, 345), y, 36, 24);
    for (let i = 0; i < 2; i++) add(FL[(R() * 5) | 0], rand(x0, 352), y + rand(-15, 15), 12, 12);
  }
  // start beach
  add('nest', 286, 120, 48, 28); add('reed', 18, 70, 20, 40); add('reed', 342, 74, 20, 40); add('reed', 330, 92, 18, 36);
  add('flP', 54, 150, 12, 12); add('flY', 300, 168, 12, 12); add('flB', 30, 120, 12, 12); add('bush', 330, 190, 36, 24); add('bush', 24, 200, 36, 24);
  add('tree', 316, 250, 56, 68); add('tree', 40, 280, 56, 68);
  // farm
  const fy = -L;
  add('tree', 30, fy - 130, 56, 68); add('tree', 334, fy - 170, 56, 68); add('tree', 300, fy - 60, 56, 68);
  add('bush', 260, fy - 70, 36, 24); add('bush', 40, fy - 50, 36, 24);
  add('fence', 36, fy - 66, 48, 24); add('fence', 264, fy - 66, 48, 24); add('fence', 312, fy - 66, 48, 24);
  for (let i = 0; i < 16; i++) add(FL[i % 5], rand(10, 350), fy - rand(30, 240), 12, 12);
  D.sort((a, b) => a.y - b.y);
  return D;
}

function newGame() {
  const defs = shuffle(DUCK_DEFS.slice());
  G = {
    t: 0, started: false, landing: false, landT: 0, ended: false, saved: 0,
    mama: { x: 180, y: -24, vx: 0, vy: 0, face: 1, quack: 0, expr: 'normal', exprT: 0, bob: 0, id: 99 },
    ducks: [], line: [], trail: [], hazards: [], sched: buildSchedule(), si: 0, lastSpawn: -9,
    floats: [], parts: [], bubbles: [], idle: 0, gather: false, wasGather: false, eagleCD: 4,
    stats: { rescues: 0, gone: [], time: 0 }, wfWarn: false, wfFallWarn: false, deco: buildDeco(), hintT: 0
  };
  for (let k = 0; k < 60; k++) G.trail.push({ x: 180, y: -24 + k * 6 });
  for (let i = 0; i < N_DUCKS; i++) {
    const d = {
      id: i, name: defs[i].name, acc: defs[i].acc, x: 180 + rand(-3, 3), y: -24 + (i + 1) * GAP + 8, vx: 0, vy: 0,
      state: 'follow', face: 1, bob: R() * 6, strain: 0, lock: 0, expr: 'normal', exprT: 0, quack: 0, scatter: 0,
      rockT: 0, panic: 0, wander: R() * 6.28, li: i, tx: 0, ty: 0, fall: 0, bag: null, bread: null, spin: null, holder: null
    };
    G.ducks.push(d); G.line.push(d);
  }
  camY = G.mama.y - VH * 0.62;
  clampCam();
}

/* ---------------- helpers ---------------- */
function setExpr(o, e, t) { o.expr = e; o.exprT = t; }
function defaultExpr(d) { return d.state === 'lost' || d.state === 'tangled' ? 'sad' : d.state === 'spin' ? 'dizzy' : 'normal'; }
function float(x, y, txt, col, icon, size = 18, life = 1.2) { G.floats.push({ x, y, txt, col, icon, size, t: 0, life }); }
function burst(x, y, kind, n, sp = 70) {
  for (let i = 0; i < n; i++) G.parts.push({ x, y, vx: rand(-sp, sp), vy: rand(-sp * 1.3, -sp * 0.2), t: 0, life: rand(.6, 1.1), kind, s: rand(.7, 1.2), rot: rand(-1, 1) });
}
function catchable(d) { return d.state === 'follow' || d.state === 'lost' || d.state === 'lured' || d.state === 'tangled'; }
function cur(o) { return G.started && !G.landing && inWater(o.y) ? CUR : 0; }
function diffAt() { return clamp(-G.mama.y / WF_START, 0, 1); }
function pickTail(frac = 0.75) { const n = G.line.length; if (!n) return null; return G.line[Math.min(n - 1, Math.floor(n * frac))]; }

function detach(d, state, label) {
  const i = G.line.indexOf(d); const was = i >= 0;
  if (was) G.line.splice(i, 1);
  d.state = state; d.lock = 0.9; d.strain = 0; d.rockT = 0; d.scatter = 0; d.wander = R() * 6.28;
  setExpr(d, state === 'lured' ? 'happy' : 'sad', 2.5);
  if (was) { float(d.x, d.y - 18, '-1', '#ff7aa2', 'duck_sad'); Snd.sad(); buzz(35); bumpHud(); }
  if (label) float(d.x, d.y - 38, label, '#b78aa3', null, 12, 1.4);
}
function takeDuck(d, how, holder, label) {
  const i = G.line.indexOf(d); const was = i >= 0;
  if (was) G.line.splice(i, 1);
  d.state = how; d.holder = holder; d.bag = null; setExpr(d, 'sad', 99);
  float(d.x, d.y - 18, was ? '-1' : '…', '#ff7aa2', 'duck_sad');
  if (label) float(d.x, d.y - 38, label, '#b78aa3', null, 12, 1.4);
  G.stats.gone.push(d.name); Snd.sad(); buzz([40, 40, 60]); bumpHud();
}
function rejoin(d) {
  const freed = d.state === 'tangled';
  if (d.bread) { d.bread.duck = null; d.bread = null; }
  d.state = 'follow'; d.strain = 0; d.rockT = 0; d.scatter = 0; d.panic = 0; d.bag = null; d.spin = null;
  G.line.push(d); setExpr(d, 'happy', 1.6);
  float(d.x, d.y - 18, '+1', '#4fc39a', null, 20);
  if (freed) float(d.x, d.y - 40, '解開了！', '#4fc39a', null, 12);
  burst(d.x, d.y - 8, 'heart', 5, 50); Snd.chime(); buzz(15); G.stats.rescues++; bumpHud();
}
function startFall(d) {
  const i = G.line.indexOf(d); const was = i >= 0; if (was) G.line.splice(i, 1);
  d.state = 'falling'; d.fall = 0; setExpr(d, 'wow', 9);
  float(d.x - 20, d.y - 18, was ? '-1' : '…', '#ff7aa2', 'duck_sad');
  G.stats.gone.push(d.name); Snd.sad(); Snd.splash(.3); buzz([40, 40, 60]); bumpHud();
  if (!G.wfFallWarn) { G.wfFallWarn = true; toast('icoFall', '有小鴨被沖下瀑布了…靠左一點！', true); }
}

/* ---------------- trail ---------------- */
function pushTrail() {
  const m = G.mama, T = G.trail, h = T[0];
  if (!h || hyp(m.x - h.x, m.y - h.y) > 2.5) T.unshift({ x: m.x, y: m.y });
  let acc = 0, px = m.x, py = m.y;
  const MAX = N_DUCKS * GAP + 140;
  for (let i = 0; i < T.length; i++) { acc += hyp(T[i].x - px, T[i].y - py); px = T[i].x; py = T[i].y; if (acc > MAX) { T.length = i + 1; break; } }
}
function rebuildTrail(ux, uy) {
  const m = G.mama; G.trail = [];
  for (let k = 1; k < 70; k++) G.trail.push({ x: m.x - ux * k * 5, y: m.y - uy * k * 5 });
}
function trailTargets(n) {
  const out = [], T = G.trail; let px = G.mama.x, py = G.mama.y, acc = 0, i = 0;
  for (let k = 0; k < n; k++) {
    const dist = (k + 1) * GAP + 8;
    while (i < T.length) {
      const q = T[i], seg = hyp(q.x - px, q.y - py);
      if (acc + seg >= dist && seg > 0) { const t = (dist - acc) / seg; out.push({ x: px + (q.x - px) * t, y: py + (q.y - py) * t }); break; }
      acc += seg; px = q.x; py = q.y; i++;
    }
    if (i >= T.length) out.push({ x: px, y: py + (dist - acc) });
  }
  return out;
}
function gatherPos(k) {
  const m = G.mama; let r, a;
  if (k < 6) { r = 27; a = k / 6 * Math.PI * 2 + 0.5; }
  else { r = 44; a = (k - 6) / 9 * Math.PI * 2 + 0.2; }
  return { x: m.x + Math.cos(a) * r, y: m.y + Math.sin(a) * r * 0.85 + 4 };
}

/* ---------------- physics helpers ---------------- */
function envForce(o, isMama) {
  let fx = 0, fy = 0;
  const k = wfK(o.y);
  if (k > 0 && G.started) {
    const li = o.state === 'follow' ? o.li : 6;
    fx += k * (isMama ? 36 : 42 + li * 4.5);
    if (!isMama) fx += k * Math.sin(G.t * 3.1 + (o.id || 0) * 1.9) * 28;
  }
  for (const h of G.hazards) if (h.force) { const f = h.force(o, isMama); fx += f[0]; fy += f[1]; }
  return [fx, fy];
}
function collideSolids(o, r, isMama) { let hit = false; for (const h of G.hazards) if (h.collide && h.collide(o, r, isMama)) hit = true; return hit; }
function clampBanks(o, r, isMama) {
  if (o.y >= 52 || o.y <= -L) { o.x = clamp(o.x, 10, W - 10); return; }
  const bl = bankL(o.y);
  if (o.x < bl + r) { o.x = bl + r; if (o.vx < 0) o.vx *= -0.2; }
  const wf = isWF(o.y);
  if (wf && !isMama) return;
  const lim = wf ? WF_X - r - (isMama ? 46 : 6) : bankR(o.y) - r;
  if (o.x > lim) { o.x = lim; if (o.vx > 0) o.vx *= -0.2; }
}

/* ---------------- hazards ---------------- */
class Rocks {
  constructor(diff) {
    this.type = 'rocks'; this.rocks = [];
    const rows = diff < 0.45 ? 2 : 3; let side = R() < .5 ? -1 : 1;
    for (let r = 0; r < rows; r++) {
      const y = camY - 60 - r * 150, bl = bankL(y), br = riverR(y);
      const gw = lerp(100, 74, diff);
      const gc = side < 0 ? bl + gw / 2 + 16 : br - gw / 2 - 16;
      for (let x = bl + 10; x < br - 6; x += rand(33, 42)) {
        if (Math.abs(x - gc) < gw / 2 + 12) continue;
        this.rocks.push({ x: x + rand(-4, 4), y: y + rand(-12, 12), r: rand(14, 20), n: R() < .5 ? 'rock1' : 'rock2', f: R() < .5 ? 1 : -1, ph: R() * 6 });
      }
      side *= -1;
    }
    this.top = Math.min(...this.rocks.map(k => k.y));
    this.bot = Math.max(...this.rocks.map(k => k.y));
  }
  update() { if (this.top - 50 > camY + VH) this.done = true; }
  collide(o, r) {
    let hit = false;
    for (const k of this.rocks) {
      const dx = o.x - k.x, dy = o.y - k.y, d = hyp(dx, dy), m = r + k.r * 0.86;
      if (d < m) { if (d < 0.01) { o.y += m; } else { o.x = k.x + dx / d * m; o.y = k.y + dy / d * m; } hit = true; }
    }
    return hit;
  }
  drawUnder() {
    ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 2;
    for (const k of this.rocks) {
      const s = 1 + 0.08 * Math.sin(G.t * 3 + k.ph);
      ctx.beginPath(); ctx.ellipse(k.x, k.y + 4, k.r * 1.25 * s, k.r * 0.8 * s, 0, 0, Math.PI * 2); ctx.stroke();
    }
  }
  drawMain() {
    for (const k of this.rocks) {
      ctx.save(); ctx.translate(k.x, k.y); ctx.scale(k.f, 1);
      spr(k.n, 0, -k.r * 0.25, k.r * 2.4, k.r * 2.0); ctx.restore();
    }
  }
}

class Eagle {
  constructor(diff, bonus) {
    this.type = 'eagle'; this.phase = 'shadow'; this.t = 0; this.bonus = bonus;
    this.dur = bonus ? 1.6 : lerp(2.5, 1.85, diff); this.grabN = diff > 0.55 ? 2 : 1; this.R = 34;
    const tg = pickTail(0.8) || G.mama;
    this.sx = tg.x + rand(-50, 50); this.sy = tg.y + rand(-90, -30); this.carry = []; this.side = R() < .5 ? -1 : 1;
    Snd.screech();
  }
  aim() {
    const n = G.line.length;
    if (n) { let x = 0, y = 0, c = 0; for (let i = Math.max(0, n - 4); i < n; i++) { x += G.line[i].x; y += G.line[i].y; c++; } return { x: x / c, y: y / c }; }
    const lost = G.ducks.filter(catchable); if (lost.length) return lost[0];
    return G.mama;
  }
  pos() {
    if (this.phase === 'shadow') return { x: this.sx + Math.cos(G.t * 1.7) * 60, y: camY + 120 + Math.sin(G.t * 3.4) * 10, s: 0.7 };
    if (this.phase === 'dive') { const u = Math.pow(clamp(this.t / 0.42, 0, 1), 2); return { x: lerp(this.fx, this.sx, u), y: lerp(this.fy, this.sy - 14, u), s: lerp(0.7, 1.25, u) }; }
    const u = clamp(this.t / 1.4, 0, 1), e = u * u;
    return { x: lerp(this.sx, this.sx + this.side * 140, e), y: lerp(this.sy - 14, camY - 160, u), s: lerp(1.25, 0.8, u) };
  }
  update(dt) {
    this.t += dt;
    if (this.phase === 'shadow') {
      const a = this.aim(), sp = G.idle > 0.5 ? 170 : 60;
      const dx = a.x - this.sx, dy = a.y - this.sy, d = hyp(dx, dy);
      if (d > 1) { const m = Math.min(d, sp * dt); this.sx += dx / d * m; this.sy += dy / d * m; }
      if (this.t >= this.dur) { const p = this.pos(); this.fx = p.x; this.fy = p.y; this.phase = 'dive'; this.t = 0; Snd.whoosh(); }
    } else if (this.phase === 'dive') {
      if (this.t >= 0.42) { this.strike(); this.phase = 'leave'; this.t = 0; }
    } else {
      const p = this.pos(); this.carry.forEach((d, i) => { d.x = p.x + (i - (this.carry.length - 1) / 2) * 12; d.y = p.y + 22 * p.s; });
      if (this.t > 1.4) { this.carry.forEach(d => d.state = 'gone'); this.done = true; }
    }
  }
  strike() {
    const m = G.mama;
    burst(this.sx, this.sy, 'drop', 8, 80); Snd.splash(.25);
    if (hyp(m.x - this.sx, m.y - this.sy) < this.R + 10) {
      float(m.x, m.y - 40, '鴨媽媽趕走老鷹！', '#5aaee6', null, 14); Snd.quack(.9); setExpr(m, 'wow', 1); m.quack = .45; return;
    }
    const c = G.ducks.filter(d => catchable(d) && hyp(d.x - this.sx, d.y - this.sy) < this.R)
      .sort((a, b) => hyp(a.x - this.sx, a.y - this.sy) - hyp(b.x - this.sx, b.y - this.sy));
    for (const d of c.slice(0, this.grabN)) { takeDuck(d, 'carried', this, '被老鷹抓走了'); this.carry.push(d); }
    if (!this.carry.length) float(this.sx, this.sy - 20, '撲空了！', '#5aaee6', null, 14);
  }
  drawUnder() {
    if (this.phase === 'leave') return;
    const u = this.phase === 'shadow' ? clamp(this.t / this.dur, 0, 1) : 1;
    const r = lerp(12, 30, u) + (this.phase === 'dive' ? 6 * this.t / 0.42 : 0);
    ctx.fillStyle = `rgba(95,60,120,${lerp(.12, .32, u)})`;
    ctx.beginPath(); ctx.ellipse(this.sx, this.sy, r * 1.3, r * 0.75, 0, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.setLineDash([5, 5]); ctx.lineDashOffset = -G.t * 20;
    ctx.strokeStyle = `rgba(255,120,160,${0.35 + 0.35 * Math.sin(G.t * 10) * u})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(this.sx, this.sy, this.R * 1.2, this.R * 0.8, 0, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  }
  drawOver() {
    const p = this.pos(), flap = 1 + 0.12 * Math.sin(G.t * (this.phase === 'shadow' ? 9 : 16));
    for (const d of this.carry) drawDuck(d, false);
    ctx.save(); ctx.translate(p.x, p.y); ctx.scale(p.s, p.s * flap); spr('eagle', 0, 0, 64, 42); ctx.restore();
  }
}

class Rapids {
  constructor(diff) {
    this.type = 'rapids'; this.h = lerp(150, 200, diff); this.y2 = camY - 20; this.y1 = this.y2 - this.h;
    this.calm = R() < .5 ? -1 : 1; this.amp = lerp(140, 180, diff); this.seed = R() * 10;
  }
  rough(o) {
    if (o.y < this.y1 || o.y > this.y2) return 0;
    const e = Math.min(1, (o.y - this.y1) / 30, (this.y2 - o.y) / 30);
    const bl = bankL(o.y), br = riverR(o.y), u = clamp((o.x - bl) / (br - bl), 0, 1);
    const cu = this.calm < 0 ? u : 1 - u;
    return smooth(0.16, 0.36, cu) * e;
  }
  force(o, isMama) {
    const r = this.rough(o); if (r <= 0) return Z;
    o._rough = Math.max(o._rough || 0, r);
    const tur = Math.sin(G.t * 4.2 + o.y * 0.045 + this.seed + (o.id || 0) * 1.7) * 0.7 + Math.sin(G.t * 7.3 + o.x * 0.05) * 0.3;
    return [tur * (isMama ? 30 : this.amp) * r, (isMama ? 45 : 100) * r];
  }
  update() { if (this.y1 > camY + VH + 30) this.done = true; }
  drawUnder() {
    const y1 = this.y1, y2 = this.y2;
    if (y2 < camY - 20 || y1 > camY + VH + 20) return;
    ctx.save();
    ctx.beginPath();
    for (let y = y1; y <= y2; y += 10) { const bl = bankL(y), br = riverR(y), w = br - bl; const x = this.calm < 0 ? bl + w * 0.28 : bl; ctx.lineTo(x, y); }
    for (let y = y2; y >= y1; y -= 10) { const bl = bankL(y), br = riverR(y), w = br - bl; const x = this.calm < 0 ? br : bl + w * 0.72; ctx.lineTo(x, y); }
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.fill(); ctx.clip();
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    for (let i = 0; i < 26; i++) {
      const hx = hash(i, 7), hy = hash(i, 3);
      const x = bankL(y1) + hx * (riverR(y1) - bankL(y1));
      const y = y1 + ((hy * this.h + G.t * 160) % this.h);
      const len = 10 + hash(i, 9) * 14;
      ctx.globalAlpha = 0.5 + 0.5 * Math.sin(Math.PI * (y - y1) / this.h);
      ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 4 * Math.sin(G.t * 6 + i), y + len / 2, x, y + len); ctx.stroke();
    }
    ctx.globalAlpha = 1; ctx.fillStyle = 'rgba(255,255,255,.8)';
    for (let i = 0; i < 18; i++) {
      const x = bankL(y1) + hash(i, 11) * (riverR(y1) - bankL(y1)), y = y1 + ((hash(i, 13) * this.h + G.t * 120) % this.h);
      ctx.beginPath(); ctx.arc(x, y, 1.5 + hash(i, 5) * 2.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
}

class Logs {
  constructor(diff) {
    this.type = 'logs'; this.y = camY - 40; this.vy = lerp(34, 48, diff); this.r = 11;
    const bl = bankL(this.y), br = riverR(this.y);
    this.gw = lerp(92, 70, diff); this.gx = rand(bl + 26, br - 26 - this.gw);
    this.segs = [[bl - 40, this.gx], [this.gx + this.gw, br + 40]];
  }
  update(dt) { this.y += this.vy * dt; if (this.y - 30 > camY + VH) this.done = true; }
  collide(o, r, isMama) {
    let hit = false;
    for (const [a, b] of this.segs) {
      if (isMama) { if (o.x > a && o.x < b && Math.abs(o.y - this.y) < r + this.r) o.onLog = true; continue; } // mama can clamber over, slowly
      const cx = clamp(o.x, a, b), cy = this.y, dx = o.x - cx, dy = o.y - cy, d = hyp(dx, dy), m = r + this.r;
      if (d < m) { if (d < 0.01) o.y = cy + m; else { o.x = cx + dx / d * m; o.y = cy + dy / d * m; } hit = true; }
    }
    return hit;
  }

class Fisher {
  constructor(diff) {

    if (this.phase === 'cast') { const u = clamp(this.t / 0.38, 0, 1); return { x: lerp(h.x, this.tx, u), y: lerp(h.y - 34, this.ty, u) - Math.sin(u * Math.PI) * 50, r: lerp(10, this.R, u) }; }

/* ---------------- update ---------------- */
function update(dt) {
  G.t += dt;
  const m = G.mama;
  if (mode !== 'play') { m.bob += dt; updateFx(dt); return; }
  if (G.started && !G.landing) G.stats.time += dt;

  // --- mama ---
  m.quack = Math.max(0, m.quack - dt);
  if (m.exprT > 0) { m.exprT -= dt; if (m.exprT <= 0) m.expr = 'normal'; }
  let wx = 0, wy = 0, ux = 0, uy = -1;
  if (G.landing) {
    const tx = 150, ty = -L - 72, dx = tx - m.x, dy = ty - m.y, d = hyp(dx, dy);
    if (d > 3) { wx = dx / d * 70; wy = dy / d * 70; }
  } else if (pointer.down) {
    const tx = pointer.sx / scale, ty = pointer.sy / scale + camY, dx = tx - m.x, dy = ty - m.y, d = hyp(dx, dy);
    if (d > 6) { const sp = Math.min(MAMA_SPD, d * 3.2); wx = dx / d * sp; wy = dy / d * sp; ux = dx / d; uy = dy / d; }
  }
  const a = Math.min(1, dt * 7);

  const fm = G.landing ? Z : envForce(m, true);
  const slow = m.onLog ? 0.3 : 1; m.onLog = false;
  m.x += (m.vx * slow + fm[0]) * dt; m.y += (m.vy * slow + fm[1] + cur(m)) * dt;
  if (!G.landing) { collideSolids(m, 13, true); clampBanks(m, 14, true); m.y = Math.min(m.y, 30); }
  if (Math.abs(m.vx) > 30) m.face = m.vx > 0 ? 1 : -1;

  // idle / gather
  if (G.started && !G.landing) { if (!pointer.down) G.idle += dt; else G.idle = 0; }
  G.gather = !G.landing && G.idle > 0.6;
  if (!G.gather && G.wasGather) rebuildTrail(ux, uy);
  G.wasGather = G.gather;
  if (!G.gather) pushTrail();
  if (G.started && !G.landing) for (const q of G.trail) if (inWater(q.y)) q.y += CUR * dt;

  // --- ducks ---
  updateDucks(dt);

  // --- hazards ---
  if (G.started && !G.landing) {
    const p = -m.y, diff = diffAt();
    const maxA = diff < 0.4 ? 1 : 2;
    const nxt = G.sched[G.si];
    if (nxt && p > WF_START - 880) G.si = G.sched.length;  // keep the run-up to the waterfall clear
    else if (nxt && p >= nxt.p && G.hazards.length < maxA && G.t - G.lastSpawn > 1.6) { spawnHazard(nxt.type, diff); G.si++; }
    G.eagleCD -= dt;
    if (G.idle > 2.8 && G.eagleCD <= 0 && G.line.length && G.hazards.length < 2 && !G.hazards.some(h => h.type === 'eagle') && p > 200 && p < WF_START - 100) {
      spawnHazard('eagle', Math.max(diff, 0.6), true); G.eagleCD = 7;
    }
    if (!G.wfWarn && p > WF_START - 520) { G.wfWarn = true; toast('icoFall', '前方瀑布！水流往右拉，走左邊的小水道', true); Snd.alert(); }
  }
  for (const h of G.hazards) h.update(dt);
  G.hazards = G.hazards.filter(h => !h.done);

  // waterfall rumble
  const p = -m.y; Snd.setRumble(G.started && mode === 'play' ? clamp(1 - Math.abs(p - (WF_START + WF_END) / 2) / 700, 0, 1) : 0);

  // landing

    G.landing = true; G.landT = 0; G.saved = G.line.length; G.hazards = [];

    Snd.win(); buzz([30, 40, 30]); setExpr(m, 'happy', 99);

  }

    G.landT += dt;
    if (R() < dt * 6) { const d = G.line[(R() * G.line.length) | 0]; if (d) { burst(d.x, d.y - 10, 'heart', 1, 30); setExpr(d, 'happy', 2); } }
    if (G.landT > 2.8 && !G.ended) { G.ended = true; showResult(); }
  }

  updateFx(dt);

function updateDucks(dt) {

        break;
      }

        d.x = s.h.cx + Math.cos(s.a) * s.r; d.y = s.h.cy + Math.sin(s.a) * s.r * 0.8;
        d.face = Math.sin(s.a) * s.h.dir > 0 ? -1 : 1;

    const a = act[i];

/* ---------------- render ---------------- */
const FONT = '"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif';

  ctx.moveTo(x, y - s * 2); ctx.quadraticCurveTo(x, y, x + s * 2, y); ctx.quadraticCurveTo(x, y, x, y + s * 2); ctx.quadraticCurveTo(x, y, x - s * 2, y); ctx.quadraticCurveTo(x, y, x, y - s * 2); ctx.fill();
}

function render() {
  const k = dpr * scale;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#c9f0d6'; ctx.fillRect(0, 0, cvs.width, cvs.height);
  if (!G) return;
  ctx.setTransform(k, 0, 0, k, 0, -camY * k);
  const top = camY - 10, bot = camY + VH + 10;

  drawGrass(top, bot);
  drawRiver(top, bot);
  drawWaterfall(top, bot);
  drawWaterTex(top, bot);
  drawShores(top, bot);
  for (const d of G.deco) if (d.layer === 'water' && d.y > top - 30 && d.y < bot + 30) drawDeco(d);
  for (const h of G.hazards) if (h.drawUnder) h.drawUnder();
  for (const d of G.deco) if (d.layer === 'land' && d.y > top - 40 && d.y < bot + 80) drawDeco(d);
  drawLandmarks(top, bot);
  for (const h of G.hazards) if (h.drawMain) h.drawMain();

  const ents = G.ducks.filter(d => d.state === 'follow' || d.state === 'lost' || d.state === 'lured' || d.state === 'tangled' || d.state === 'spin' || d.state === 'falling');

function drawGrass(top, bot) {

  const s = 40;
